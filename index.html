<!-- 1er script contient les fonctions principales de chargement -->  
<script>

function depDepuisCp(cp) {
  cp = String(cp || "").trim();
  if (cp.startsWith("97") && cp.length >= 3) {
     return cp.substring(0, 3);
  }
  return cp.substring(0, 2);
}

async function chargerStationsTousDeps(deps, carburant, userLat, userLon) {
   const baseUrls = [
         "data/latest/",
         "https://krinou.github.io/prixcarb/data/latest/",
         "https://raw.githubusercontent.com/krinou/prixcarb/main/data/latest/"
         ];

   for (const baseUrl of baseUrls) {
      const ts = Date.now();
      const urls = deps.map(dep => `${baseUrl}${dep}.json?ts=${ts}`);
      const results = await Promise.all(
      urls.map(url =>
        fetch(url, { cache: "no-store" })
          .then(r => {
            if (!r.ok) {
              console.warn("Erreur HTTP :", r.status, url);
              return null;
            }
            return r.json();
          })
          .catch(err => {
            console.warn("Erreur fetch :", url, err);
            return null;
          })
      )
    );

    const fichiersOk = results.filter(x => x != null);
    if (fichiersOk.length > 0) {
       console.log("Chargement OK depuis :", baseUrl);
       console.log("Nombre de fichiers chargés :", fichiersOk.length, "/", deps.length);
       const stations = fichiersOk.flatMap(json => json);
       // Calcul dynamique
       const VOLUME = 50, CONSO = 10;
       return stations
         .filter(st => st.carburants && st.carburants[carburant] != null)
         .map(st => {
             const prix = parseFloat(st.carburants[carburant].valeur);
             const dist = haversine(userLat, userLon, st.latitude, st.longitude);
             const coutTotal = prix * VOLUME + (2 * dist / 100) * CONSO * prix;
             const prixPondere = coutTotal / VOLUME;
             const cp = st.cp ?? st.code_postal ?? "";
             const depStation = st.dep ?? depDepuisCp(cp);
             return {
                id : st.id,
                dep : depStation,
                latitude : st.latitude,
                longitude : st.longitude,
                station : st.nom ?? st.enseigne ?? "Inconnue",
                adresse : st.adresse ?? "",
                cp      : st.cp ?? st.code_postal ?? "",
                ville   : st.ville ?? "",
                prix,
                distance: dist,
                prixTotal: coutTotal,
                prixPondere,
                maj_gouv: st.carburants?.[carburant]?.maj ?? null
              };
          });
       }
       console.warn("Aucun fichier trouvé depuis :", baseUrl);
       return [];
     }
     console.error("Aucun fichier chargé depuis aucune source.");
     return [];
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function afficherStationsBrut() {

    return;
  }

  // 2. Carburant
  const carburant = document.getElementById("carburantSelect")?.value || "E10";


  // 1) Si coordonnées absentes, on géocode automatiquement l'adresse
  try {
       if (userLat == null || userLon == null) {
          const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(adresse)}&format=json&addressdetails=1&limit=1`;
          const res = await fetch(url, { headers: { "User-Agent": "prixcarb" } });
          const json = await res.json();
          if (!json.length) {
             statusEl.className = "alert alert-warning text-center";
             statusEl.textContent = "⚠️ Adresse introuvable.";
             return;
             }
          userLat = parseFloat(json[0].lat);
          userLon = parseFloat(json[0].lon);
          // on met aussi à jour l'adresse "propre"
         const addr = json[0].address || {};
         const voie = addr.road ?? addr.pedestrian ?? addr.path ?? "";
         const numero = addr.house_number ? addr.house_number + " " : "";
         const cp = addr.postcode ?? "";
         const ville = addr.city ?? addr.town ?? addr.village ?? "";
         const adresseCourte = `${numero}${voie}, ${cp} ${ville}`.trim();
         if (adresseCourte) {
            document.getElementById("adresseInput").value = adresseCourte;
            currentAdresse = adresseCourte;
            }
         const dep = cp.substring(0, 2);
         const voisins = [dep, ...(await getDepsVoisins(dep))].filter((v, i, a) => v && a.indexOf(v) === i);
         afficherDepsLimitrophes(dep, voisins);
       }
       // 3. Départements à charger
       const deps = Array.isArray(currentVoisins) ? currentVoisins : [];
       if (deps.length === 0) {
           statusEl.className = "alert alert-warning text-center";
           statusEl.textContent = "⚠️ Départements non déterminés. Utiliser📍Me localiser ou saisir adresse pour calculer les départements limitrophes.";
           return;
           }

       // 4. Géocodage (latitude/longitude utilisateur)
       // (à adapter selon ta logique, ici on suppose que tu as déjà userLat/userLon)
       if (userLat == null || userLon == null) {
          alert("Coordonnées utilisateur non définies !");
          return;
          }

       // 5. Chargement des stations
       console.log("Coordonnées utilisateur :", userLat, userLon)
       console.log("Départements chargés :", deps);
       const data = await chargerStationsTousDeps(deps, carburant, userLat, userLon);
       for (const dep of deps) {
           const historyDep =
           await chargerHistoriqueDepartement(dep);
           data.forEach(st => {
           if (
               st.cp &&
               st.cp.startsWith(dep)
              ) {
                 st.evolution7j =
                    calculEvolution7Jours(
                      historyDep,
                      st.id,
                      carburant
                    );
                }
           });
       }
       // Tri, affichage, etc.
       let triCol = localStorage.getItem("triCol") ?? "prixPondere";
       let triDir = localStorage.getItem("triDir") ?? "asc";
       appliquerTri(data, triCol, triDir);
       const tbody = table.querySelector("tbody");
       remplirTableau(data, tbody);
       afficherConseil(data);
       
       activerTri(table, data, triCol, triDir);
       const summary = document.getElementById("summary");
       if (summary) summary.textContent = `${data.length} stations ${carburant} trouvées`;
          statusEl.style.display = "none";
          table.style.display = "table";
      } catch (e) {
          statusEl.className = "alert alert-danger text-center";
          statusEl.textContent = "❌ Erreur : " + (e?.message || e);
          console.error(e);
          }
}
</script>

<!-- 2eme script contient les fonctions d'interface (géolocalisation, tableau, tri, etc.) -->
<script>
  let depsLimitrophes = null;
  let currentAdresse = "";      // dernière adresse validée
  let currentVoisins = [];      // derniers départements limitrophes calculés
  let userLat = null, userLon = null;

  let historiqueChart = null;
  let historiqueStationCourante = null;
  let periodeHistoriqueCourante = 180;

  const historyCache = {};
  const couleursCarburants = {
    "E10": "#198754",
    "SP95": "#0d6efd",
    "SP98": "#6f42c1",
    "Gazole": "#212529",
    "E85": "#fd7e14"
    };

function getDerniereDateStation(stationHistory) {
    let maxDate = null;

    Object.values(stationHistory).forEach(points => {
        if (!Array.isArray(points)) return;

        points.forEach(p => {
            const d = p[0];
            if (!maxDate || d > maxDate) {
                maxDate = d;
            }
        });
    });

    return maxDate;
}

function filtrerPoints(points, jours, dateRefStr) {
    if (!Array.isArray(points) || !dateRefStr) return [];

    const dateRef = new Date(dateRefStr);
    const dateLimite = new Date(dateRef);
    dateLimite.setDate(dateLimite.getDate() - jours);

    return points.filter(p => {
        const d = new Date(p[0]);
        return d >= dateLimite && d <= dateRef;
    });
}

function construireLabels(stationHistory, jours) {
    const dateRef = getDerniereDateStation(stationHistory);
    const setDates = new Set();

    Object.values(stationHistory).forEach(points => {
        filtrerPoints(points, jours, dateRef).forEach(p => {
            setDates.add(p[0]);
        });
    });

    return [...setDates].sort();
}

function formatLabelDate(dateStr) {
    const d = new Date(dateStr);

    return d.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit"
    });
}

async function ouvrirHistoriqueStation(stationId, dep, nomStation) {

    if (!stationId) {
        alert("Identifiant station absent.");
        return;
    }

    if (!dep) {
        dep = stationId.substring(0, 2);
    }

    const historiqueDep = await chargerHistoriqueDepartement(dep);
    const stationHistory = historiqueDep?.[stationId];

    if (!stationHistory) {
        alert("Historique introuvable pour cette station.");
        return;
    }

    historiqueStationCourante = {
        stationId,
        dep,
        nomStation,
        stationHistory
    };

    document.getElementById("historiqueTitre").textContent =
        `Historique des prix - ${nomStation}`;

    document.getElementById("historiqueModal").style.display = "block";

    afficherGraphiqueHistorique(periodeHistoriqueCourante);
}
  
function afficherGraphiqueHistorique(jours) {
    periodeHistoriqueCourante = jours;
    if (!historiqueStationCourante) return;

    const stationHistory = historiqueStationCourante.stationHistory;
    const labelsDates = construireLabels(stationHistory, jours);
    const labels = labelsDates.map(formatLabelDate);
    const datasets = [];
    const selectedFuel = document.getElementById("carburantSelect")?.value || "E10";

    Object.entries(stationHistory).forEach(([carburant, points]) => {
        if (!Array.isArray(points)) return;
        const dateRef = getDerniereDateStation(stationHistory);
        const pointsFiltres = filtrerPoints(points, jours, dateRef);
        if (pointsFiltres.length === 0) return;
        const prixParDate = {};
        pointsFiltres.forEach(([date, prix]) => {
            prixParDate[date] = Number(prix);
        });

        const data = labelsDates.map(date => {
            return prixParDate[date] ?? null;
        });

        datasets.push({
            label: carburant,
            data: data,
            borderColor: couleursCarburants[carburant] ?? "#666",
            backgroundColor: couleursCarburants[carburant] ?? "#666",
            borderWidth: 2,
            pointRadius: jours <= 30 ? 3 : 0,
            tension: 0.25,
            spanGaps: true,
            hidden: carburant !== selectedFuel
        });
    });

    const canvas = document.getElementById("historiqueChart");

    if (historiqueChart) {
        historiqueChart.destroy();
    }

    historiqueChart = new Chart(canvas, {
        type: "line",
        data: {
            labels,
            datasets
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const value = context.parsed.y;
                            return `${context.dataset.label} : ${value.toFixed(3)} €/L`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    ticks: {
                        callback: function(value) {
                            return value.toFixed(2) + " €";
                        }
                    }
                }
            }
        }
    });

    afficherResumeHistorique(stationHistory, jours);

    document.querySelectorAll(".periode-histo").forEach(btn => {
        btn.classList.toggle(
            "active",
            Number(btn.dataset.jours) === Number(jours)
        );
    });
}
  
function afficherResumeHistorique(stationHistory, jours) {

    const carburants = Object.keys(stationHistory);
    const dateRef = getDerniereDateStation(stationHistory);

    let html = `Période affichée : ${jours} jours. `;

    html += `Carburants disponibles : ${carburants.join(", ")}.`;

    document.getElementById("historiqueResume").textContent = html;
}

function fermerHistorique() {
    document.getElementById("historiqueModal").style.display = "none";
}
  
async function chargerHistoriqueDepartement(dep) {
    if (historyCache[dep]) {
        return historyCache[dep];
    }

    const ts = Date.now();

    const urls = [
        `data/history/${dep}.json?ts=${ts}`,
        `https://krinou.github.io/prixcarb/data/history/${dep}.json?ts=${ts}`,
        `https://raw.githubusercontent.com/krinou/prixcarb/main/data/history/${dep}.json?ts=${ts}`
    ];

    for (const url of urls) {

        try {

            const res = await fetch(url, {
                cache: "no-store"
            });

            if (!res.ok) {
                continue;
            }

            const json = await res.json();

            historyCache[dep] = json;

            return json;

        } catch (e) {
            console.warn(e);
        }
    }

    return {};
 }

 function calculEvolution7Jours(historyDep, stationId, carburant) {

    if (!historyDep?.[stationId]?.[carburant]) {
        return null;
    }

    const h = historyDep[stationId][carburant];

    if (h.length < 2) {
        return null;
    }

    const dernierPrix = Number(h[h.length - 1][1]);

    const dateLimite = new Date();
    dateLimite.setDate(dateLimite.getDate() - 7);

    let prixIlYA7Jours = null;

    for (let i = h.length - 1; i >= 0; i--) {

        const d = new Date(h[i][0]);

        if (d <= dateLimite) {
            prixIlYA7Jours = Number(h[i][1]);
            break;
        }
    }

    if (prixIlYA7Jours == null) {
        return null;
    }

 }

let autocompleteTimeout = null;

document.getElementById("adresseInput").addEventListener("input", function () {
    const query = this.value.trim();
    if (!query) {
        document.getElementById("autocompleteList").innerHTML = "";
        return;
    }
    clearTimeout(autocompleteTimeout);
    autocompleteTimeout = setTimeout(() => autocomplete(query), 250);
});

async function autocomplete(query) {
    // ✅ 1. Filtre minimal
    if (query.length < 3) {
        document.getElementById("autocompleteList").innerHTML = "";
        return;
    }

    let url;

    if (/^\d+$/.test(query)) {
       url = `https://api-adresse.data.gouv.fr/search/?q=${query}&limit=20`;
    }  else {
       url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&limit=20`;
    }

    try {
        const res = await fetch(url);
        if (!res.ok) {
            console.warn("API erreur :", res.status);
            return;
        }
      
        const json = await res.json();
        if (!json || !Array.isArray(json.features)) {
            console.warn("Réponse invalide :", json);
            return;
        }

        const list = document.getElementById("autocompleteList");
        list.innerHTML = "";

        if (/^\d+$/.test(query)) {
          json.features = json.features.filter(f =>
            f.properties.postcode &&
            f.properties.postcode.startsWith(query)
            );
        }
      
        json.features.forEach(feat => {
            const props = feat.properties;
            const label = props.label;        // Exemple : "25 Rue Thomas Lemaître 92000 Nanterre"
            const voie = props.name;          // Exemple : "Rue Thomas Lemaître"
            const cp = props.postcode;
            const ville = props.city;

            const adresseCourte = `${voie}, ${cp} ${ville}`;

            const li = document.createElement("li");
            li.className = "list-group-item";
            li.textContent = adresseCourte;

            li.onclick = async () => {
                document.getElementById("adresseInput").value = adresseCourte;
                currentAdresse = adresseCourte;
                list.innerHTML = "";
                userLon = feat.geometry.coordinates[0];
                userLat = feat.geometry.coordinates[1];
                const dep = cp.substring(0, 2);
                const voisins = [dep, ...(await getDepsVoisins(dep))].filter((v, i, a) => v && a.indexOf(v) === i);
                afficherDepsLimitrophes(dep, voisins);
                console.log("Départements limitrophes :", voisins);
            };
            list.appendChild(li);
        });

    } catch (e) {
        console.error("Erreur autocomplétion", e);
    }
}

function afficherEvolution(delta) {
  if (delta == null) {
     return "";
    }

  if (delta < -0.1) {
     return `🟢 ${delta.toFixed(1)} cts (7 j)`;
    }

  if (delta > 0.1) {
     return `🔴 +${delta.toFixed(1)} cts (7 j)`;
  }

  return `⚪ Stable`;
}

function buildRow(obj, i) {
  console.log("buildRow maj_gouv =", obj.maj_gouv);
  const age = agePrixEnJours(obj.maj_gouv);
  const tr = document.createElement("tr");
  if (age > 21) {
    tr.classList.add("prix-perime");
    }
  else if (age > 15) {
          tr.classList.add("prix-ancien");
          }

  const mapsUrl =
        (obj.latitude && obj.longitude)
        ? `<a href="https://www.google.com/maps/search/?api=1&query=${obj.latitude},${obj.longitude}">`
        : `<a href="https://www.google.com/maps/search/?api=1&query=${
        encodeURIComponent(obj.adresse + ' ' + obj.cp + ' ' + obj.ville)
        }">`;
  
  tr.innerHTML = `
    <td>${i+1}</td>
    <td> ${mapsUrl} ${obj.station} </a> </td>
    <td> ${mapsUrl} ${obj.adresse} </a> </td>
    <td>${obj.cp}</td>
    <td>${obj.ville}</td>
    <td>${obj.prix != null ? obj.prix.toFixed(3) : "-"}</td>
    <td>${obj.distance != null ? obj.distance.toFixed(2) : "-"}</td>
    <td>${obj.prixTotal != null ? obj.prixTotal.toFixed(2) : "-"}</td>
    <td>${obj.prixPondere != null ? obj.prixPondere.toFixed(3) : "-"}</td>
    <td>${afficherEvolution(obj.evolution7j)}</td>
    <td>
       <button
          type="button"
          class="btn btn-sm btn-outline-primary btn-historique"
          data-id="${escapeHtml(obj.id)}"
          data-dep="${escapeHtml(obj.dep)}"
          data-station="${escapeHtml(obj.station)}">
        &#128200;
       </button>
    </td>
    <td>
       ${age > 21 ? '🔺 ' : age > 15 ? '⚠️ ' : ''}
       ${formatDateFR(obj.maj_gouv)}
    </td>
  `;
  return tr;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}

function formatDateFR(maj) {
  if (!maj) return "";

  // maj attendu: "YYYY-MM-DD HH:MM:SS"
  // On ne dépend pas de Date() (qui peut interpréter selon le navigateur)
  const m = String(maj).match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T].*)?$/);
  if (!m) return String(maj); // fallback si format inattendu

  const yy = m[1].slice(-2);
  const mm = m[2];
  const dd = m[3];
  return `${dd}/${mm}/${yy}`;
}

function agePrixEnJours(maj) {
    if (!maj) return 999;

    const dateMaj = new Date(maj.replace(" ", "T"));
    const maintenant = new Date();

    return Math.floor(
        (maintenant - dateMaj) / (1000 * 60 * 60 * 24)
    );
}

// --------------------------------------------------
// Tri principal + tri secondaire + tri tertiaire
// --------------------------------------------------

function appliquerTri(data, col, dir) {
  const sens = (dir === "asc" ? 1 : -1);

  data.sort((a,b) => {
    // 1) Tri principal
    const c1 = compare(a[col], b[col]) * sens;
    if (c1 !== 0) return c1;

    // 2) Tri secondaire : distance
    const c2 = compare(a.distance, b.distance);
    if (c2 !== 0) return c2;

    // 3) Tri tertiaire : prix simple
    const c3 = compare(a.prix, b.prix);
    return c3;
  });
}

function compare(a,b) {
  const na = Number(a), nb = Number(b);
  if (!Number.isFinite(na) && !Number.isFinite(nb)) return 0;
  if (!Number.isFinite(na)) return 1;
  if (!Number.isFinite(nb)) return -1;
  return na - nb;
}

// --------------------------------------------------
// Activer le tri SUR 3 COLONNES SEULEMENT :
// Prix (col 5), Distance (6), Prix pondéré (8)
// --------------------------------------------------

function activerTri(table, data, triCol, triDir) {
  const tbody   = table.querySelector("tbody");
  const headers = table.querySelectorAll("th");

  // colonnes triables (alignées sur ton <thead>)
  const COL = {
    5: "prix",
    6: "distance",
    8: "prixPondere"
  };

  // marquage visuel
  Object.entries(COL).forEach(([idx,key]) => {
    headers[idx].classList.add("sortable-header");
    if (key === triCol) headers[idx].classList.add(triDir === "asc" ? "sort-asc" : "sort-desc");
  });

  headers.forEach((th, idx) => {
    if (!(idx in COL)) return; // ignorer autres colonnes

    const key = COL[idx];

    if (th.dataset.triActive) return;
    th.dataset.triActive = "1";

    th.addEventListener("click", () => {
      let col = key;
      let oldCol = localStorage.getItem("triCol") ?? "prixPondere";
      let oldDir = localStorage.getItem("triDir") ?? "asc";

      // sens du tri
      let dir = (oldCol === col) ? (oldDir==="asc"?"desc":"asc") : "asc";

      // mémoriser
      localStorage.setItem("triCol", col);
      localStorage.setItem("triDir", dir);

      // appliquer tri
      appliquerTri(data, col, dir);
      remplirTableau(data, tbody);

      // mettre à jour flèches
      headers.forEach(h=>h.classList.remove("sort-asc","sort-desc"));
      th.classList.add(dir==="asc" ? "sort-asc":"sort-desc");
    });
  });
}
