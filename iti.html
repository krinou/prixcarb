<!DOCTYPE html>
<html lang="fr">
<style>
  th.sortable-header { cursor: pointer; user-select: none; }
  th.sort-asc::after  { content: " ▲"; font-size: 0.9em; color: #666; }
  th.sort-desc::after { content: " ▼"; font-size: 0.9em; color: #666; }
  #autocompleteList {
    max-height: 220px;
    overflow-y: auto;
    width: 100%;
    cursor: pointer;
  }
  #autocompleteList li:hover {
    background: #eee;
  }
  #depart,
  #arrivee,

  .form-ligne {
    overflow-x: auto;
  }
  
  .message-zone {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px;
    margin: 10px 0;
    min-height: 45px;
    display: flex;
    align-items: center;
}
</style>
   
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>PrixCarb.fr – Station essence la moins chère sur votre itinéraire</title>
   <meta name="description" content="Comparez les prix des carburants sur votre itineraire. PrixCarb recherche les stations les moins cheres sur votre itineraire avec une marge de 2 kms">
   <link rel="icon" type="image/png" href="iti.ico">
   <!-- Bootstrap 5 (mise en forme professionnelle) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
   <div class="container mt-4 mb-5">
      <h1 class="mb-4 text-center">🛣️ Les stations les moins chères sur votre itinéraire</h1>
      <a href="index.html"
         class="btn btn-outline-primary"
         title="Basculer vers la recherche de stations les moins chères autour de vous">
         ⛽ Vers Autour de vous
      </a>
      <p class="lead">
         Optimisez votre itineraire pour dépenser moins.
      </p>
     
      <div class="form-check mb-3">
          <input class="form-check-input"
                type="checkbox"
                id="multiItineraires"
                title="Comparer les itinéraires rapide, sans péage, court et court sans péage">
        
          <label class="form-check-label"
                for="multiItineraires">
                Comparer plusieurs itinéraires
          </label>
     </div>
     
      <div class="d-flex gap-2 align-items-center">
          <select id="carburant" class="form-select" style="width: 120px;">
              <option value="Gazole">Gazole</option>
              <option value="E10" selected>SP95-E10</option>
              <option value="SP98">SP98</option>
              <option value="E85">E85</option>
          </select> 
  
          <div class="position-relative flex-grow-1">
              <input id="depart" class="form-control"
                 placeholder="Adresse de départ" autocomplete="off">
              <ul id="suggestionsDepart"
                 class="list-group position-absolute w-100"
                 style="z-index: 2000;">
              </ul>
          </div>
        
          <button class="btn btn-outline-secondary px-2" onclick="geolocaliser('depart')" title="Me localiser">🎯 </button>
      </div>          
     
       <div class="d-flex gap-2 align-items-center mt-2">
          <div style="width:120px"></div>

          <div class="position-relative flex-grow-1">
             <input id="arrivee" class="form-control"
                placeholder="Adresse d'arrivée"  autocomplete="off">
             <ul id="suggestionsArrivee"
                class="list-group position-absolute w-100"
                style="z-index: 2000; ">
             </ul>
          </div>
        
          <button class="btn btn-outline-secondary px-2" onclick="geolocaliser('arrivee')" title="Me localiser">🎯</button>
          <button class="btn btn-primary px-2" style="width:180px" onclick="chercherStations()">🔄 Rechercher </button>
      </div>
   </div>
  
   <div id="message" class="message-zone"></div>

   <table id="tableItineraires"
       class="table table-striped table-hover table-bordered align-middle mt-3"
       style="display:none;">
    <thead class="table-dark">
        <tr>
            <th>Itinéraire</th>
            <th>Temps</th>
            <th>Kms</th>
            <th>Recherche stations</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  
  <table id="tableResultats" class="table table-striped table-hover table-bordered align-middle" style="display:none;">
    <thead class="table-dark">
         <tr>
            <th>Enseigne</th>
            <th>Adresse</th>
            <th>Dist. du départ</th>
            <th>Prix </th>
            <th>Date Maj</th>
            <th>Ecart trajet</th>
         </tr>
      </thead>
   
      <tbody>
      </tbody>

   </table>

<script>

// clef ORS
const ORS_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImMxZmI0OWU0OWIzMjQ3ZTViZjEzYmMwMzBlY2NjMmM1IiwiaCI6Im11cm11cjY0In0=";

// mêmes données que PrixCarb
let stations=[];
let coordDepart = null;
let coordArrivee = null;

//Tri du tableau
let colonneTri = "prix";
let ordreTri = 1;
const COL = {
  2: "distanceDepart",
  3: "prix",
  5: "distanceTrajet"
  };
  
let resultat = [];
let itinerairesCalcules = [];

const MODES_ITINERAIRES = [
    {
        code: "rapidePeage",
        nom: "🚀 Rapide avec péage",
        preference: null,
        sansPeage: false,
        couleur: "#e53935"
    },
    {
        code: "rapideSansPeage",
        nom: "🚗 Rapide sans péage",
        preference: null,
        sansPeage: true,
        couleur: "#1e88e5"
    },
    {
        code: "courtPeage",
        nom: "📏 Court avec péage",
        preference: "shortest",
        sansPeage: false,
        couleur: "#43a047"
    },
    {
        code: "courtSansPeage",
        nom: "🚜 Court sans péage",
        preference: "shortest",
        sansPeage: true,
        couleur: "#00acc1"
    }
];

function appliquerTri() {
    resultat.sort((a, b) => {
        const av = a[colonneTri];
        const bv = b[colonneTri];

        if (typeof av === "string") {
            return av.localeCompare(bv) * ordreTri;
        }

        return (av - bv) * ordreTri;
    });
}

function trier(colonne) {

    if (colonneTri === colonne) {
        ordreTri *= -1;
    } else {
        colonneTri = colonne;
        ordreTri = 1;
    }

    appliquerTri();
    afficher(resultat);
}

/* ============================
   AUTOCOMPLÉTION ADRESSES
   API Adresse.data.gouv.fr
   ============================ */

async function autocompleteAdresse(texte, cible) {

    if (texte.length < 3) {
        document.getElementById(cible).innerHTML = "";
        return;
    }

    const url = "https://api-adresse.data.gouv.fr/search/?q=" 
                + encodeURIComponent(texte)
                + "&limit=5";

    const r = await fetch(url);
    const j = await r.json();
    const liste = document.getElementById(cible);
    liste.innerHTML = "";
    
    for (const f of j.features) {
       const li = document.createElement("li");
       li.className = "list-group-item";
       li.textContent =`${f.properties.name}, ${f.properties.postcode} ${f.properties.city}`;
       li.onclick = () => {
          choisirAdresse(cible,f.properties.label,f.geometry.coordinates);
          };
       liste.appendChild(li);  
    };      
}

function choisirAdresse(cible, texte, coords) {
    const estDepart =
        cible === "suggestionsDepart";

    const champ = estDepart
        ? document.getElementById("depart")
        : document.getElementById("arrivee");

    champ.value = texte;

    if (estDepart) {
        coordDepart = coords;
    } else {
        coordArrivee = coords;
    }

    document.getElementById(cible).innerHTML = "";
}

/* ============================
   GÉOLOCALISATION + REVERSE
   ============================ */

function geolocaliser(idChamp) {

    navigator.geolocation.getCurrentPosition(async pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // Reverse geocode
        const url = "https://api-adresse.data.gouv.fr/reverse/?lat=" 
                    + lat + "&lon=" + lon;

        const r = await fetch(url);
        const j = await r.json();

        const adresse = j.features[0].properties.label;

        document.getElementById(idChamp).value = adresse;

    }, err => {
        alert("Impossible de récupérer votre position.");
    });
}

/* ============================
   ÉCOUTE DES CHAMPS
   ============================ */

document.getElementById("depart").addEventListener("input", e => {
    coordDepart = null;
    autocompleteAdresse(e.target.value, "suggestionsDepart");
});

document.getElementById("arrivee").addEventListener("input", e => {
    coordArrivee = null;
    autocompleteAdresse(e.target.value, "suggestionsArrivee");
});

async function geocode(adresse){

    const url =
      "https://api.openrouteservice.org/geocode/search?api_key="
      + ORS_KEY
      + "&text="
      + encodeURIComponent(adresse);

    const r = await fetch(url);
    const j = await r.json();

    return j.features[0].geometry.coordinates;

}

async function calculItineraire(dep,arr, mode){
    console.log("Appel ORS :", mode.nom || "itinéraire standard");
    const body = {
          coordinates: [
             dep,
             arr
          ] 
          };
    if (mode.preference) { 
       body.preference = mode.preference;
       }
    if (mode.sansPeage) {
       body.options = {
          avoid_features: ["tollways"]
          };
    }
  
    const r = await fetch(
        'https://api.openrouteservice.org/v2/directions/driving-car/geojson',
        {
            method:'POST',
            headers:{
                'Authorization':ORS_KEY,
                'Content-Type':'application/json'
            },
            body:JSON.stringify(body)
        }
    );
    console.log("Réponse ORS :", r.status);
    const data = await r.json();
    console.log("Données ORS :", data);

    if (!r.ok) {
       throw new Error(
          data.error?.message ||data.message ||"Erreur OpenRouteService"
       );
    }
    return data;
}

function extraireResumeItineraire(itin) {
    const props = itin.features[0].properties;

    const distance =
        props.summary?.distance ??
        props.segments?.reduce(
            (total, segment) => total + segment.distance,
            0
        ) ??
        0;

    const duration =
        props.summary?.duration ??
        props.segments?.reduce(
            (total, segment) => total + segment.duration,
            0
        ) ??
        0;

    return {
        distanceKm: distance / 1000,
        dureeSecondes: duration
    };
}

function formaterDuree(secondes) {
    const minutes = Math.round(secondes / 60);
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) {
        return m + " min";
    }

    return h + "h" + String(m).padStart(2, "0");
}

function distanceKm(lat1,lon1,lat2,lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function distanceMiniTrajet(station,coords){
    let min=999999;
    for(const p of coords){
        const d=distanceKm(
            station.latitude,
            station.longitude,
            p[1],
            p[0]
        );

        if(d<min) min=d;
    }

    return min;
}

async function calculer4Itineraires(depCoord, arrCoord) {
    const resultats = [];

    for (const mode of MODES_ITINERAIRES) {
        try {
            document.getElementById("message").innerHTML = "⏳ Calcul : " + mode.nom;

            const itin =
                await calculItineraire(
                    depCoord,
                    arrCoord,
                    mode
                );

            const resume = extraireResumeItineraire(itin);
            resultats.push({
                ...mode,
                itin: itin,
                distanceKm: resume.distanceKm,
                dureeSecondes: resume.dureeSecondes,
                erreur: null
            });
        } catch (e) {
            console.error(
                "Erreur itinéraire",
                mode.nom,
                e
            );

            resultats.push({
                ...mode,
                itin: null,
                distanceKm: null,
                dureeSecondes: null,
                erreur: e.message
            });
        }
    }

    return resultats;
}
  
function afficherTableauItineraires(liste) {
    const tbody =
        document.querySelector(
            "#tableItineraires tbody"
        );

    tbody.innerHTML = "";

    liste.forEach((it, index) => {
        let temps = "-";
        let kms = "-";
        let action = "";

        if (it.erreur) {
            action = `<span class="text-danger" title="${it.erreur}">
                         Erreur
                      </span>`;
        } else {
            temps = formaterDuree(it.dureeSecondes);
            kms =   it.distanceKm.toFixed(1) + " km";

            action =
                `<button class="btn btn-sm btn-outline-primary"
                         onclick="selectionnerItineraire(${index})">
                    Rechercher stations
                 </button>`;
        }

        tbody.insertAdjacentHTML(
            "beforeend",
            `<tr>
                <td>
                    <span style="color:${it.couleur}; font-weight:bold;">
                        ${it.nom}
                    </span>
                </td>
                <td>${temps}</td>
                <td>${kms}</td>
                <td>${action}</td>
            </tr>`
        );
    });

    document.getElementById("tableItineraires").style.display = "table";
}
  
async function chercherStations(){
    const multiItineraires =
    document.getElementById("multiItineraires").checked;
    if (multiItineraires) {
       const depCoord = coordDepart || await geocode(depart);
       const arrCoord = coordArrivee || await geocode(arrivee);
       itinerairesCalcules = await calculer4Itineraires(depCoord, arrCoord);
       afficherTableauItineraires(itinerairesCalcules);
       return;
       }
  
    document.getElementById("message").innerHTML = "⏳ Calcul en cours...";

    const carburantChoisi = document.getElementById("carburant").value;
    const depart  = document.getElementById("depart").value;
    const arrivee = document.getElementById("arrivee").value;

    if (!depart || !arrivee) {
       alert("Veuillez saisir un départ et une arrivée");
       return;
       }
  
    const depCoord = coordDepart  || await geocode(depart);
    const arrCoord = coordArrivee || await geocode(arrivee);

    console.log("depart =", depart);
    console.log("arrivee =", arrivee);
    console.log("depCoord =", depCoord);
    console.log("arrCoord =", arrCoord);
  
    const itin = await calculItineraire(
                       depCoord,
                       arrCoord
                       );

    const coords =
        itin.features[0]
            .geometry
            .coordinates;

    const t0 = performance.now();
    const deps = await trouverDepartementsTraverses(itin);
    const t1 = performance.now();
    
    stations = [];
    for (const dep of deps) {
        console.log("chargement", dep);
        const r = await fetch(`data/latest/${dep}.json`);
        if (!r.ok) {
           console.log("introuvable", dep);
            continue;
            }
        const data = await r.json();
        stations.push(...data);
        }
    console.log( "Stations chargées :", stations.length);

    resultat=[];

    for(const st of stations){
       // on ignore les stations hors des départements traversés
       if(!deps.includes(st.dep))
          continue;
      
       const info = st.carburants?.[carburantChoisi];
       if (!info)
           continue;

       const prix = parseFloat(info.valeur);
       if (isNaN(prix))
          continue; 
        
       const d = distanceMiniTrajet(st, coords);
       if(d <= 2){
          const distanceDepart = distanceKm(
                 depCoord[1],
                 depCoord[0],
                 st.latitude,
                 st.longitude
                 ); 
          resultat.push({
            ...st,
            carburant: carburantChoisi,
            prix: prix,
            distanceDepart,
            distanceTrajet:d
          });
       }   
    }

    appliquerTri();
    console.log(resultat[0]);
    afficher(resultat);

    document.getElementById("message")
        .innerHTML =
        resultat.length +
        " station(s) trouvée(s) pour le carburant " + carburantChoisi;

}

function selectionnerItineraire(index){
   const it = itinerairesCalcules[index];

   document.getElementById("message")
      .innerHTML =
      it.nom +
      " - " +
      formaterDuree(it.dureeSecondes) +
      " - " +
      it.distanceKm.toFixed(1) +
      " km";

   console.log(it);
}

async function trouverDepartementsTraverses(itin) {
   const t0 = performance.now();
   const bboxIndex =
         await fetch("data/departements_bbox.json")
         .then(r => r.json());

   const bbox = itin.bbox;
   const minLon = bbox[0];
   const minLat = bbox[1];
   const maxLon = bbox[2];
   const maxLat = bbox[3];

   const marge = 0.02; // environ 2 km

   const deps = bboxIndex
       .filter(dep =>
           dep.maxLat >= minLat - marge &&
           dep.minLat <= maxLat + marge &&
           dep.maxLon >= minLon - marge &&
           dep.minLon <= maxLon + marge
           )
       .map(dep => dep.dep);

   const t1 = performance.now();

   console.log(
     `Départements traversés : ${deps.join(", ")} (${Math.round(t1 - t0)} ms)`
   );
   return deps;
}
    
function formaterDateMaj(dateMaj) {
    if (!dateMaj) {
        return "";
    }

    const d = new Date(dateMaj);
    if (isNaN(d.getTime())) {
        return dateMaj.substring(0, 10);
    }
    return d.toLocaleDateString("fr-FR");
}
  
function afficher(liste){
    const tbody =
      document.querySelector(
          "#tableResultats tbody"
      );

    tbody.innerHTML="";

    for(const st of liste){
        const infoCarburant = st.carburants?.[st.carburant];
        const dateMaj = formaterDateMaj(infoCarburant?.maj);
        const maps = `https://www.google.com/maps?q=${st.latitude},${st.longitude}`;
        tbody.insertAdjacentHTML(
            "beforeend",
            `<tr>
                <td>
                   <a href="${maps}"
                      target="_blank">
                      ${st.enseigne}
                   </a>
                </td>

                <td>
                   <a href="${maps}" target="_blank">
                     ${st.adresse}<br>
                     ${st.cp} ${st.ville}
                   </a>
                </td>

                <td>${st.distanceDepart.toFixed(1)} km</td>
                <td class="prix">
                    ${st.prix.toFixed(3)}
                </td>

                <td>${dateMaj}</td>

                <td class="ecart">
                    ${st.distanceTrajet.toFixed(1)}
                    km
                </td>

            </tr> `
            );
    }
  console.log("affichage de", liste.length, "lignes");
  document.getElementById("tableResultats").style.display = "table";  
  mettreAJourEntetesTri();
}
  
function mettreAJourEntetesTri() {
    const headers = document.querySelectorAll("#tableResultats thead th");

    headers.forEach(h => {
        h.classList.remove(
            "sortable-header",
            "sort-asc",
            "sort-desc"
        );
    });

    Object.entries(COL).forEach(([idx, key]) => {
        headers[idx].classList.add(
            "sortable-header"
        );

        headers[idx].onclick =
            () => trier(key);

        if (key === colonneTri) {
            headers[idx].classList.add(
                ordreTri === 1
                    ? "sort-asc"
                    : "sort-desc"
            );
        }
    });
}
</script>

</body>
