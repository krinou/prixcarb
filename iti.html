<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Stations sur mon trajet</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}

.zone-saisie{
    display:flex;
    flex-wrap:nowrap;
    gap:6px;
    align-items:flex-start;
}
    
.champ1{
    position:relative
}
.champ2{
    flex:1;
    min-width:0;
}
.champ3{
    white-space:nowrap;
}
    
.suggestions {
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    background:white;
    border:1px solid #ccc;
    z-index:10;
}
.suggestions div {
    padding:6px;
    cursor:pointer;
}
.suggestions div:hover {
    background:#eee;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

th{
    background:#f0f0f0;
}

.prix{
    text-align:right;
}

.ecart{
    text-align:right;
}

</style>
</head>

<body>

<h2>Stations-service sur votre trajet</h2>

<div class="zone-saisie">
    <div class="champ1">
      <input id="depart"  placeholder="Adresse de départ">
      <div id="suggestionsDepart" class="suggestions"></div>
      <button onclick="geolocaliser('depart')"
           title="Ma position">🎯
      </button>
   </div>
    
   <div class="champ2">
      <input id="arrivee" placeholder="Adresse d'arrivée">
      <div id="suggestionsArrivee" class="suggestions"></div>
      <button onclick="geolocaliser('arrivee')"
          title="Ma position">🎯
      </button>
   </div>
    
   <div class="champ3">
      <button onclick="chercherStations()">
         Rechercher
      </button>
   </div>
</div>
    
<div id="message"></div>

<table id="tableResultats">

<thead>
<tr>
    <th>Enseigne</th>
    <th>Adresse</th>
    <th>Carburant</th>
    <th>Prix</th>
    <th>Ecart trajet</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

<script>

// clef ORS
const ORS_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImMxZmI0OWU0OWIzMjQ3ZTViZjEzYmMwMzBlY2NjMmM1IiwiaCI6Im11cm11cjY0In0=";

// mêmes données que PrixCarb
let stations=[];

/* ============================
   AUTOCOMPLÉTION ADRESSES
   API Adresse.data.gouv.fr
   ============================ */

async function autocompleteAdresse(texte, cible) {

    if (texte.length < 3) {
        document.getElementById(cible).innerHTML = "";
        return;
    }

    const url = "https://api-adresse.data.gouv.fr/search/?q=" 
                + encodeURIComponent(texte)
                + "&limit=5";

    const r = await fetch(url);
    const j = await r.json();

    let html = "";

    for (const f of j.features) {
        html += `<div onclick="choisirAdresse('${cible}', '${f.properties.label.replace(/'/g, "\\'")}')">
                    ${f.properties.label}
                 </div>`;
    }

    document.getElementById(cible).innerHTML = html;
}

function choisirAdresse(cible, texte) {
    const champ = (cible === "suggestionsDepart") 
                  ? document.getElementById("depart")
                  : document.getElementById("arrivee");

    champ.value = texte;
    document.getElementById(cible).innerHTML = "";
}

/* ============================
   GÉOLOCALISATION + REVERSE
   ============================ */

function geolocaliser(idChamp) {

    navigator.geolocation.getCurrentPosition(async pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // Reverse geocode
        const url = "https://api-adresse.data.gouv.fr/reverse/?lat=" 
                    + lat + "&lon=" + lon;

        const r = await fetch(url);
        const j = await r.json();

        const adresse = j.features[0].properties.label;

        document.getElementById(idChamp).value = adresse;

    }, err => {
        alert("Impossible de récupérer votre position.");
    });
}

/* ============================
   ÉCOUTE DES CHAMPS
   ============================ */

document.getElementById("depart").addEventListener("input", e => {
    autocompleteAdresse(e.target.value, "suggestionsDepart");
});

document.getElementById("arrivee").addEventListener("input", e => {
    autocompleteAdresse(e.target.value, "suggestionsArrivee");
});

async function geocode(adresse){

    const url =
      "https://api.openrouteservice.org/geocode/search?api_key="
      + ORS_KEY
      + "&text="
      + encodeURIComponent(adresse);

    const r = await fetch(url);
    const j = await r.json();

    return j.features[0].geometry.coordinates;

}

async function calculItineraire(dep,arr){
    console.log("Appel ORS"); 
    const r = await fetch(
        'https://api.openrouteservice.org/v2/directions/driving-car/geojson',
        {
            method:'POST',
            headers:{
                'Authorization':ORS_KEY,
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                coordinates:[
                    dep,
                    arr
                ]
            })
        }
    );
    console.log("Réponse ORS :", r.status);
    const data = await r.json();
    console.log("Données ORS :", data);

    if (!r.ok) {
       throw new Error(
          data.error?.message ||data.message ||"Erreur OpenRouteService"
       );
    }
    return data;
}

function distanceKm(lat1,lon1,lat2,lon2){

    const R=6371;

    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function distanceMiniTrajet(station,coords){

    let min=999999;

    for(const p of coords){

        const d=distanceKm(
            station.latitude,
            station.longitude,
            p[1],
            p[0]
        );

        if(d<min) min=d;
    }

    return min;
}

async function chercherStations(){

    document.getElementById("message").innerHTML =
        "Calcul en cours...";

    const depart =
        document.getElementById("depart").value;

    const arrivee =
        document.getElementById("arrivee").value;

    const depCoord =
        await geocode(depart);

    const arrCoord =
        await geocode(arrivee);

    const itin =
        await calculItineraire(
            depCoord,
            arrCoord
        );

    const coords =
        itin.features[0]
            .geometry
            .coordinates;

    const t0 = performance.now();
    const deps = await trouverDepartementsTraverses(itin);
    const t1 = performance.now();
    
    stations = [];
    for (const dep of deps) {
        console.log("chargement", dep);
        const r = await fetch(`data/latest/${dep}.json`);
        if (!r.ok) {
           console.log("introuvable", dep);
            continue;
            }
        const data = await r.json();
        stations.push(...data);
        }
    console.log( "Stations chargées :", stations.length);

    let resultat=[];

    for(const st of stations){
       // on ignore les stations hors des départements traversés
       if(!deps.includes(st.dep))
          continue;

       const d = distanceMiniTrajet(st, coords);
       if(d <= 2){
          resultat.push({
            ...st,
            distanceTrajet:d
          });
       }   
    }

    resultat.sort(
       (a,b)=>a.prix - b.prix
    );
    
    afficher(resultat);

    document.getElementById("message")
        .innerHTML =
        resultat.length +
        " station(s) trouvée(s)";

}

async function trouverDepartementsTraverses(itin) {
   const t0 = performance.now();
   const bboxIndex =
         await fetch("data/departements_bbox.json")
         .then(r => r.json());

   const bbox = itin.bbox;
   const minLon = bbox[0];
   const minLat = bbox[1];
   const maxLon = bbox[2];
   const maxLat = bbox[3];

   const marge = 0.02; // environ 2 km

   const deps = bboxIndex
       .filter(dep =>
           dep.maxLat >= minLat - marge &&
           dep.minLat <= maxLat + marge &&
           dep.maxLon >= minLon - marge &&
           dep.minLon <= maxLon + marge
           )
       .map(dep => dep.dep);

   const t1 = performance.now();

   console.log(
     `Départements traversés : ${deps.join(", ")} (${Math.round(t1 - t0)} ms)`
   );
   return deps;
}
    
function afficher(liste){

    const tbody =
      document.querySelector(
          "#tableResultats tbody"
      );

    tbody.innerHTML="";

    for(const st of liste){

        const maps =
            `https://www.google.com/maps?q=${st.latitude},${st.longitude}`;

        tbody.insertAdjacentHTML(
            "beforeend",
            `
            <tr>

            <td>
                <a href="${maps}"
                   target="_blank">
                ${st.station}
                </a>
            </td>

            <td>
                <a href="${maps}"
                   target="_blank">
                ${st.adresse}
                </a>
            </td>

            <td>${st.carburant}</td>

            <td class="prix">
                ${st.prix.toFixed(3)}
            </td>

            <td class="ecart">
                ${st.distanceTrajet.toFixed(1)}
                km
            </td>

            </tr>
            `
        );
    }
}

</script>

</body>
</html>
