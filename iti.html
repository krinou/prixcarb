function appliquerTri() {
    resultat.sort((a, b) => {
        const av = a[colonneTri];
        const bv = b[colonneTri];

        if (typeof av === "string") {
            return av.localeCompare(bv) * ordreTri;
        }

        return (av - bv) * ordreTri;
    });
}

function trier(colonne) {

    if (colonneTri === colonne) {
        ordreTri *= -1;
    } else {
        colonneTri = colonne;
        ordreTri = 1;
    }

    appliquerTri();
    afficher(resultat);
}

/* ============================
   AUTOCOMPLÉTION ADRESSES

async function autocompleteAdresse(texte, cible) {

    if (texte.length < 3) {
        document.getElementById(cible).innerHTML = "";
        return;
    }

    const url = "https://api-adresse.data.gouv.fr/search/?q=" 
                + encodeURIComponent(texte)
                + "&limit=5";

    const r = await fetch(url);
    const j = await r.json();
    const liste = document.getElementById(cible);
    liste.innerHTML = "";
    
    for (const f of j.features) {
       const li = document.createElement("li");
       li.className = "list-group-item";
       li.textContent =`${f.properties.name}, ${f.properties.postcode} ${f.properties.city}`;
       li.onclick = () => {
          choisirAdresse(cible,f.properties.label,f.geometry.coordinates);
          };
       liste.appendChild(li);  
    };      
}

function choisirAdresse(cible, texte, coords) {
    const estDepart =
        cible === "suggestionsDepart";

    const champ = estDepart
        ? document.getElementById("depart")
        : document.getElementById("arrivee");

    champ.value = texte;

    if (estDepart) {
        coordDepart = coords;
    } else {
        coordArrivee = coords;
    }

    document.getElementById(cible).innerHTML = "";
}

function geolocaliser(idChamp) {

    navigator.geolocation.getCurrentPosition(async pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // Reverse geocode
        const url = "https://api-adresse.data.gouv.fr/reverse/?lat=" 
                    + lat + "&lon=" + lon;

        const r = await fetch(url);
        const j = await r.json();

        const adresse = j.features[0].properties.label;

        document.getElementById(idChamp).value = adresse;
        if(idChamp==="depart"){
           coordDepart=[lon,lat];
        }else{
           coordArrivee=[lon,lat];
        }
    }, err => {
        alert("Impossible de récupérer votre position.");
    });
}

async function geocode(adresse){

    const url =
      "https://api.openrouteservice.org/geocode/search?api_key="
      + ORS_KEY
      + "&text="
      + encodeURIComponent(adresse);

    const r = await fetch(url);
    const j = await r.json();

    return j.features[0].geometry.coordinates;

}

async function calculItineraire(dep,arr, mode){
    console.log("Appel ORS :", mode.nom || "itinéraire standard");
    const body = {
          coordinates: [
             dep,
             arr
          ] 
          };
    if (mode.preference) { 
       body.preference = mode.preference;
       }
    if (mode.sansPeage) {
       body.options = {
          avoid_features: ["tollways"]
          };
    }
  
    const r = await fetch(
        'https://api.openrouteservice.org/v2/directions/driving-car/geojson',
        {
            method:'POST',
            headers:{
                'Authorization':ORS_KEY,
                'Content-Type':'application/json'
            },
            body:JSON.stringify(body)
        }
    );
    console.log("Réponse ORS :", r.status);
    const data = await r.json();
    console.log("Données ORS :", data);

    if (!r.ok) {
       throw new Error(
          data.error?.message ||data.message ||"Erreur OpenRouteService"
       );
    }
    return data;
}

function extraireResumeItineraire(itin) {
    const props = itin.features[0].properties;

    const distance =
        props.summary?.distance ??
        props.segments?.reduce(
            (total, segment) => total + segment.distance,
            0
        ) ??
        0;

    const duration =
        props.summary?.duration ??
        props.segments?.reduce(
            (total, segment) => total + segment.duration,
            0
        ) ??
        0;

    return {
        distanceKm: distance / 1000,
        dureeSecondes: duration
    };
}

function formaterDuree(secondes) {
    const minutes = Math.round(secondes / 60);
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) {
        return m + " min";
    }

    return h + "h" + String(m).padStart(2, "0");
}

function distanceKm(lat1,lon1,lat2,lon2){
    const R=6371;
    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function distanceMiniTrajet(station,coords){
    let min=999999;
    for(const p of coords){
        const d=distanceKm(
            station.latitude,
            station.longitude,
            p[1],
            p[0]
        );

        if(d<min) min=d;
    }

    return min;
}

async function calculer4Itineraires(depCoord, arrCoord) {
    const resultats = [];

    for (const mode of MODES_ITINERAIRES) {
        try {
            setMessage("⏳ Calcul : " + mode.nom);

            const itin =
                await calculItineraire(
                    depCoord,
                    arrCoord,
                    mode
                );

            const resume = extraireResumeItineraire(itin);
            resultats.push({
                ...mode,
                itin: itin,
                distanceKm: resume.distanceKm,
                dureeSecondes: resume.dureeSecondes,
                erreur: null
            });
        } catch (e) {
            console.error(
                "Erreur itinéraire",
                mode.nom,
                e
            );

            resultats.push({
                ...mode,
                itin: null,
                distanceKm: null,
                dureeSecondes: null,
                erreur: e.message
            });
        }
    }

    return resultats;
}

async function rechercherStationsSurItineraire(
      itin,
      depCoord,
      carburantChoisi
) {
    const coords =
        itin.features[0]
            .geometry
            .coordinates;

    const t0 = performance.now();
    const deps = await trouverDepartementsTraverses(itin);
    const t1 = performance.now();
    
    stations = [];
    for (const dep of deps) {
        console.log("chargement", dep);
        const r = await fetch(`data/latest/${dep}.json`);
        if (!r.ok) {
           console.log("introuvable", dep);
            continue;
            }
        const data = await r.json();
        stations.push(...data);
        }
    console.log( "Stations chargées :", stations.length);

    resultat=[];

    for(const st of stations){
       // on ignore les stations hors des départements traversés
       if(!deps.includes(st.dep))
          continue;
      
       const info = st.carburants?.[carburantChoisi];
       if (!info)
           continue;

       const prix = parseFloat(info.valeur);

                 st.longitude
                 ); 
          resultat.push({
            ...st,
            carburant: carburantChoisi,
            prix: prix,
            distanceDepart,
            distanceTrajet:d
          });
       }   
    }

    console.log(resultat[0]);
    afficher(resultat);

    setMessage(        
        resultat.length +
        " station(s) trouvée(s) pour le carburant " + carburantChoisi );
}

async function trouverDepartementsTraverses(itin) {
   const t0 = performance.now();
   const bboxIndex =
         await fetch("data/departements_bbox.json")
         .then(r => r.json());

   const bbox = itin.bbox;
   const minLon = bbox[0];
   const minLat = bbox[1];
   const maxLon = bbox[2];
   const maxLat = bbox[3];

   const marge = 0.02; // environ 2 km

   const deps = bboxIndex
       .filter(dep =>
           dep.maxLat >= minLat - marge &&
           dep.minLat <= maxLat + marge &&
           dep.maxLon >= minLon - marge &&
           dep.minLon <= maxLon + marge
           )
       .map(dep => dep.dep);

   const t1 = performance.now();

   console.log(
     `Départements traversés : ${deps.join(", ")} (${Math.round(t1 - t0)} ms)`
   );
   return deps;
}
    
function formaterDateMaj(dateMaj) {
    if (!dateMaj) {
        return "";
    }

    const d = new Date(dateMaj);
    if (isNaN(d.getTime())) {
        return dateMaj.substring(0, 10);
    }
    return d.toLocaleDateString("fr-FR");
}

            );
    }
  console.log("affichage de", liste.length, "lignes");

  document.getElementById("titreStations").innerHTML =
    `🛣️ ${resultat.length} station(s) ${carburantChoisi}
     trouvée(s) sur l'itinéraire ${itineraireCourant}`;
  
  document.getElementById("tableResultats").style.display = "table";  
  mettreAJourEntetesTri();
}
  
function mettreAJourEntetesTri() {
    const headers = document.querySelectorAll("#tableResultats thead th");

    headers.forEach(h => {
        h.classList.remove(
            "sortable-header",
            "sort-asc",
            "sort-desc"
        );
    });

    Object.entries(COL).forEach(([idx, key]) => {
        headers[idx].classList.add(
            "sortable-header"
        );

        headers[idx].onclick =
            () => trier(key);

        if (key === colonneTri) {
            headers[idx].classList.add(
                ordreTri === 1
                    ? "sort-asc"
                    : "sort-desc"
            );
        }
    });
}

function extraireStationsSelectionnees(distanceTrajetKm) {
    // trajet court
    if (distanceTrajetKm < 80) {
        return [...resultat]
            .sort((a,b) => a.prix - b.prix)
            .slice(0,3);
    }

    const stationsRetenues = [];
    const tranches = {};

    for (const st of resultat) {
        const tranche =
            Math.floor(st.distanceDepart / 80);

        // première station de la tranche
        // (le tableau étant trié par prix)
        if (!tranches[tranche]) {
            tranches[tranche] = st;
            stationsRetenues.push(st);
        }
    }

    return stationsRetenues;
}

function afficherStationsSelectionnees(stationsSelectionnees) {
    marqueursStations.forEach(m => map.removeLayer(m));
    marqueursStations = [];

    
  
   stationsSelectionnees.forEach((st, index) => {
       let image;
       if (index === 0) {
          image = "paev.ico"; // la moins chère = vert
       } else { 
         if (index === stationsSelectionnees.length - 1) {
             image = "paer.ico"; // la plus chère = rouge
          } else {
             image = "paeo.ico"; // bonnes affaires = orange
          }
       };
               
       const icon = L.icon({
           iconUrl: image,
           iconSize: [24, 24],
           iconAnchor: [12, 12],
           popupAnchor: [0, -12]
       });
       const marker = L.marker(
          [st.latitude, st.longitude],
          { icon: icon }
        ).addTo(map);

        marker.bindPopup(
             `<a https://www.google.com/maps/search/?api=1&query=${st.latitude},${st.longitude}
                 target="_blank"> ${st.enseigne} </a><br>
             ${st.prix.toFixed(3)} €<br>
             ${st.distanceDepart.toFixed(0)} km du départ`
        );

        if (!L.Browser.touch) {
           let popupTimer;
           marker.on('mouseover', function () {
             clearTimeout(popupTimer);
             this.openPopup();
             });
           marker.on('mouseout', function () { 
             popupTimer = setTimeout(() => {
               this.closePopup();}, 1000); // 1 seconde
             });
        } else {
          marker.on('click', () => marker.openPopup());
        }
            
        marqueursStations.push(marker);
    });
}
